<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        @font-face{
            font-family: 'Roboto';
            src: url('./Kanit/Kanit-Regular.ttf') format('truetype');
        }
        body{
            background-color: rgb(149, 200, 200);
            font-family: 'Roboto';
        }
        h1 {
            color: white;
            text-align: center;
}
        #regic {
            font-size: 40px;
            color: red;
    }
    .input_name{
        background-color: yellow;
        border: 2px solid red;
    }
    </style>
</head>
<body>
    <h1 id="regic">Register</h1>
    <h1>แบบฟอร์มลงทะเบียน</h1>

    ชื่อ:<input class="input_name" type="text" name="fname">
